name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install the release-compatible npm client
        run: npm install --global npm@11.5.1
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --omit=optional
      - name: Install the Linux compiler binary without optional lifecycle resolution
        run: npm install --ignore-scripts --no-save --package-lock=false @aihu/compiler-linux-x64-gnu@1.3.4
      - name: Require the compiler binary for headless coverage
        run: node_modules/.bin/aihu-compile --help >/dev/null
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:contract
