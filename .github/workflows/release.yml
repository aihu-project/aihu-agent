name: Release agent packages

on:
  push:
    tags:
      - 'agent-v*.*.*'
      - 'agent-service-v*.*.*'
      - 'agent-server-v*.*.*'
      - 'agent-a2a-v*.*.*'
      - 'agent-acp-v*.*.*'

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install the minimum trusted-publishing npm client
        run: npm install --global npm@11.19.0
      - name: Check npm trusted publishing prerequisites
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          node -e "const [major, minor, patch] = require('child_process').execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim().split('.').map(Number); if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) process.exit(1)"
      - name: Check exact reviewed tag and default branch head
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            agent-v*) PACKAGE=packages/agent; TAG_PREFIX=agent ;;
            agent-service-v*) PACKAGE=packages/agent-service; TAG_PREFIX=agent-service ;;
            agent-server-v*) PACKAGE=packages/agent-server; TAG_PREFIX=agent-server ;;
            agent-a2a-v*) PACKAGE=packages/agent-a2a; TAG_PREFIX=agent-a2a ;;
            agent-acp-v*) PACKAGE=packages/agent-acp; TAG_PREFIX=agent-acp ;;
            *) echo "Unsupported release tag: $TAG" >&2; exit 1 ;;
          esac
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "TAG_PREFIX=$TAG_PREFIX" >> "$GITHUB_ENV"
          version="$(node -p "require('./${PACKAGE}/package.json').version")"
          test "$TAG" = "${TAG_PREFIX}-v${version}"
          test "$GITHUB_REF_TYPE" = tag
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Require exact merged pull-request association
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            > "$RUNNER_TEMP/associated-pulls.json"
          node - "$RUNNER_TEMP/associated-pulls.json" <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          const prs = JSON.parse(fs.readFileSync(path, 'utf8'))
          const reviewedMerge = prs.some((pr) =>
            pr.base?.ref === 'main' &&
            pr.state === 'closed' &&
            pr.merged_at &&
            pr.merge_commit_sha === process.env.GITHUB_SHA,
          )
          if (!reviewedMerge) {
            throw new Error(`no merged pull request on main is associated with ${process.env.GITHUB_SHA}`)
          }
          NODE
      - name: Require published internal prerequisites in dependency order
        run: |
          require_published() {
            package_name="$1"
            package_version="$2"
            npm view "$package_name@$package_version" version >/dev/null
          }
          case "$PACKAGE" in
            packages/agent) ;;
            packages/agent-service)
              require_published @aihu/agent 0.2.1
              ;;
            packages/agent-a2a|packages/agent-acp)
              require_published @aihu/agent 0.2.1
              require_published @aihu/agent-service 0.4.1
              ;;
            packages/agent-server)
              require_published @aihu/agent 0.2.1
              require_published @aihu/agent-service 0.4.1
              ;;
            *) echo "Unknown package: $PACKAGE" >&2; exit 1 ;;
          esac
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build the package family explicitly
        run: npm run build
      - name: Typecheck and test the selected package
        run: |
          npm run --prefix "$PACKAGE" typecheck
          npm run --prefix "$PACKAGE" test
          npm run release:contract -- --package="$PACKAGE"
      - name: Verify target version is unpublished (E404 only)
        run: |
          package_name="$(node -p "require('./${PACKAGE}/package.json').name")"
          package_version="$(node -p "require('./${PACKAGE}/package.json').version")"
          set +e
          output="$(npm view "$package_name@$package_version" version 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Eq 'npm error code E404|404 Not Found|is not in this registry'
          if printf '%s' "$output" | grep -Eq 'E401|E403|E500|ETIMEDOUT'; then exit 1; fi
      - name: Pack one exact allowlisted tarball
        id: pack
        run: |
          pack_dir="$RUNNER_TEMP/aihu-agent-pack"
          mkdir -p "$pack_dir"
          test -z "$(find "$pack_dir" -mindepth 1 -maxdepth 1 -print -quit)"
          npm pack --ignore-scripts --pack-destination "$pack_dir" "./$PACKAGE" > "$RUNNER_TEMP/pack-output.txt"
          tgz="$(find "$pack_dir" -type f -name '*.tgz' -print)"
          test "$(printf '%s\n' "$tgz" | wc -l | tr -d ' ')" -eq 1
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          npm run release:contract -- --package="$PACKAGE" --tarball="$tgz"
      - name: Verify the exact tarball in a normal isolated consumer
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          consumer="$RUNNER_TEMP/aihu-agent-consumer"
          mkdir -p "$consumer"
          npm init --yes --prefix "$consumer"
          npm install --prefix "$consumer" "$TGZ"
          (cd "$consumer" && CONSUMER_ROOT="$consumer" PACKAGE="$PACKAGE" node --input-type=module --eval "import { realpathSync } from 'node:fs'; import { fileURLToPath } from 'node:url'; import { sep } from 'node:path'; const root = realpathSync(process.env.CONSUMER_ROOT); const name = JSON.parse(await import('node:fs/promises').then((m) => m.readFile(process.env.PACKAGE + '/package.json', 'utf8'))).name; const url = await import.meta.resolve(name); const file = realpathSync(fileURLToPath(url)); if (!file.startsWith(root + sep)) throw new Error(name + ' resolved outside isolated consumer: ' + file); const api = await import(name); if (!api || Object.keys(api).length === 0) process.exit(1); console.log(name + ' -> ' + file)")
      - name: Publish the exact verified tarball with provenance
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: npm publish "$TGZ" --access public --provenance
